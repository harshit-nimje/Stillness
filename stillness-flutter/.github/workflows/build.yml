name: Scaffold and Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup Source Files
        run: |
          # Temporarily copy your real custom app logic to a safe directory
          mkdir -p /tmp/app_source
          cp -r lib assets /tmp/app_source/ || true

      - name: Create Platform Scaffolding
        run: |
          # Generate the underlying native infrastructure files
          flutter create . --platforms=android --project-name=stillness

      - name: Restore Source Files
        run: |
          # Overwrite the default Google Counter files with your real code
          cp -r /tmp/app_source/* .
          rm -rf /tmp/app_source

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

